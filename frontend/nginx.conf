# Sert l'export statique de Next.js (out/). Les routes /api/ et /_reveil sont prises par le proxy d'entrée.
# En-têtes de sécurité repris du gabarit de la plateforme (templates/nginx.conf), avec une CSP
# resserrée à 'self' : cette application n'appelle que sa propre origine (aucun CDN, aucun
# localhost:8501/9000, qui ne sont joignables ni de l'extérieur ni du navigateur d'un visiteur).
server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

  # Bundles hachés de Next (_next/static) : immuables, cache long.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Contrôles de santé : fichiers statiques public/health et public/sante.
  location ~ ^/(health|sante)$ {
    default_type text/plain;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
